<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Matcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.css" rel="stylesheet">
    <style>
        .upload-container {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            background-color: #f8f9fa;
        }
        .upload-container:hover {
            border-color: #0d6efd;
        }
        .result-container {
            display: none;
            margin-top: 30px;
        }
        .score-card {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }
        .overall-score {
            font-size: 3rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .category-score {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .suggestion-card {
            margin-bottom: 15px;
            border-left: 4px solid #0d6efd;
        }
        .priority-high {
            border-left-color: #dc3545;
        }
        .priority-medium {
            border-left-color: #ffc107;
        }
        .priority-low {
            border-left-color: #198754;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Resume Matcher</h1>
        <p class="text-center text-muted mb-5">Upload your resume and job description to get comprehensive matching analysis and optimization suggestions</p>

        <form id="uploadForm" class="mb-4">
            <div class="row">
                <div class="col-md-6">
                    <div class="upload-container">
                        <h5>Upload Resume</h5>
                        <p class="text-muted">PDF or DOCX format</p>
                        <input type="file" class="form-control" name="resume" accept=".pdf,.docx" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="upload-container">
                        <h5>Upload Job Description</h5>
                        <p class="text-muted">PDF or DOCX format</p>
                        <input type="file" class="form-control" name="job_description" accept=".pdf,.docx" required>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Analyze Match</button>
            </div>
        </form>

        <div id="resultContainer" class="result-container">
            <div class="row">
                <div class="col-md-4">
                    <div class="score-card">
                        <h3>Overall Match</h3>
                        <div class="overall-score" id="overallScore">0%</div>
                        <div class="mt-3">
                            <h4>Semantic Similarity</h4>
                            <div class="category-score" id="semanticScore">0%</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="categoryScoresChart"></canvas>
                    </div>
                </div>
                <div class="col-md-8">
                    <h3>Optimization Suggestions</h3>
                    <div id="suggestionsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script>
        let categoryChart = null;

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Display results
                    document.getElementById('resultContainer').style.display = 'block';
                    document.getElementById('overallScore').textContent = `${data.overall_score}%`;
                    document.getElementById('semanticScore').textContent = `${data.semantic_score}%`;
                    
                    // Update category scores chart
                    updateCategoryScoresChart(data.category_scores);
                    
                    // Display suggestions
                    const suggestionsList = document.getElementById('suggestionsList');
                    suggestionsList.innerHTML = '';
                    
                    data.suggestions.forEach(suggestion => {
                        const card = document.createElement('div');
                        card.className = `card suggestion-card priority-${suggestion.priority}`;
                        card.innerHTML = `
                            <div class="card-body">
                                <h5 class="card-title">${suggestion.title}</h5>
                                <p class="card-text">${suggestion.description}</p>
                            </div>
                        `;
                        suggestionsList.appendChild(card);
                    });
                } else {
                    alert(data.error || 'An error occurred during analysis');
                }
            } catch (error) {
                alert('An error occurred while processing your request');
            }
        });

        function updateCategoryScoresChart(categoryScores) {
            const ctx = document.getElementById('categoryScoresChart').getContext('2d');
            
            if (categoryChart) {
                categoryChart.destroy();
            }
            
            const categories = Object.keys(categoryScores);
            const scores = Object.values(categoryScores);
            
            categoryChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories.map(cat => cat.replace('_', ' ').toUpperCase()),
                    datasets: [{
                        label: 'Match Score',
                        data: scores,
                        backgroundColor: 'rgba(13, 110, 253, 0.2)',
                        borderColor: 'rgba(13, 110, 253, 1)',
                        pointBackgroundColor: 'rgba(13, 110, 253, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(13, 110, 253, 1)'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
